name: shapeos
description: "ShapeOS - Smart Home Automation App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🌱 State management and routing
  flutter_riverpod: ^2.6.1
  provider: ^6.0.5
  go_router: ^16.2.1

  # 🎨 UI and fonts
  google_fonts: ^6.3.1
  cupertino_icons: ^1.0.8
  fl_chart: ^1.1.0
  syncfusion_flutter_gauges: ^29.2.7

  # 🔥 Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_database: ^11.3.10
  cloud_firestore: ^5.6.12

  # 🔐 Google Sign-In
  google_sign_in: ^6.1.0

  # 🔔 Local Notifications
  flutter_local_notifications: ^17.2.2

  # 📶 Connectivity
  connectivity_plus: ^4.0.1

  # 🎙️ Speech recognition
  speech_to_text: ^7.3.0

  # 🪟 Desktop window customization
  bitsdojo_window: ^0.1.6

  # 💾 Local Storage
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/google.png
